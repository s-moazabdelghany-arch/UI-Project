<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/output.css">
    <title>Exercise Library | FitTracker</title>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen text-gray-900 font-sans">

    <aside class="w-full md:w-64 bg-gray-900 flex flex-col justify-between md:h-screen md:sticky md:top-0">
        <div class="p-6">
            <h1 class="text-3xl font-bold text-orange-500 mb-8">FitTracker</h1>
            <nav class="flex flex-col gap-2">
                <a href="dashboard.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Dashboard</a>
                <a href="exercises.html" class="p-3 bg-gray-800 text-orange-500 font-bold rounded">Exercises</a>
                <a href="add-workout.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Add Workout</a>
                <a href="settings.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Settings</a>
            </nav>
        </div>
        <div class="p-6">
            <a href="login.html" class="block w-full p-3 text-center text-white bg-red-600 hover:bg-red-700 rounded font-bold">Logout</a>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 w-full max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold">Exercise Library</h2>
                <p class="text-gray-600 mt-1">Browse available exercises.</p>
            </div>
            <button class="bg-orange-500 text-white px-4 py-2 rounded font-bold">+ Add Exercise</button>
        </div>

        <div class="mb-6">
            <input type="text" placeholder="Search exercises..." class="w-full border border-gray-300 p-3 rounded bg-white">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a href="exercise-detail.html" class="bg-white border border-gray-300 rounded p-6 shadow-sm hover:border-orange-500 transition-colors block">
                <h3 class="text-lg font-bold mb-2">Barbell Bench Press</h3>
                <p class="text-sm text-gray-600 mb-4">Target: Chest & Triceps</p>
                <span class="text-orange-500 font-bold text-sm">View Details &rarr;</span>
            </a>
            <a href="exercise-detail.html" class="bg-white border border-gray-300 rounded p-6 shadow-sm hover:border-orange-500 transition-colors block">
                <h3 class="text-lg font-bold mb-2">Pull-Ups</h3>
                <p class="text-sm text-gray-600 mb-4">Target: Back & Biceps</p>
                <span class="text-orange-500 font-bold text-sm">View Details &rarr;</span>
            </a>
            <a href="exercise-detail.html" class="bg-white border border-gray-300 rounded p-6 shadow-sm hover:border-orange-500 transition-colors block">
                <h3 class="text-lg font-bold mb-2">Barbell Squat</h3>
                <p class="text-sm text-gray-600 mb-4">Target: Legs</p>
                <span class="text-orange-500 font-bold text-sm">View Details &rarr;</span>
            </a>
        </div>
    </main>
</body>
</html>
