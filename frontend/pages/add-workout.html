<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/output.css">
    <title>Add & Log Workout | FitTracker</title>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen text-gray-900 font-sans">

    <aside class="w-full md:w-64 bg-gray-900 flex flex-col justify-between md:h-screen md:sticky md:top-0">
        <div class="p-6">
            <h1 class="text-3xl font-bold text-orange-500 mb-8">FitTracker</h1>
            
            <nav class="flex flex-col gap-2">
                <a href="dashboard.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Dashboard</a>
                <a href="exercises.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Exercises</a>
                <a href="add-workout.html" class="p-3 bg-gray-800 text-orange-500 font-bold rounded">Add Workout</a>
                <a href="settings.html" class="p-3 text-gray-400 hover:text-white hover:bg-gray-800 rounded">Settings</a>
            </nav>
        </div>
        
        <div class="p-6">
            <a href="login.html" class="block w-full p-3 text-center text-white bg-red-600 hover:bg-red-700 rounded font-bold">Logout</a>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 w-full max-w-4xl mx-auto">
        
        <div class="mb-8">
            <h2 class="text-2xl font-bold">Add Workout</h2>
            <p class="text-gray-600 mt-1">Design a new workout plan and set your targets.</p>
        </div>

        <form class="flex flex-col gap-6">
            <div class="bg-white border border-gray-300 rounded p-6 shadow-sm">
                <h3 class="text-xl font-bold mb-4">Routine Details</h3>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block font-bold text-gray-700 mb-2">Routine Name</label>
                        <input type="text" placeholder="Arnold Split" class="w-full border border-gray-300 p-3 rounded">
                    </div>
                    <div class="flex-1">
                        <label class="block font-bold text-gray-700 mb-2">Target Muscles / Split</label>
                        <input type="text" placeholder="Chest & Back" class="w-full border border-gray-300 p-3 rounded">
                    </div>
                </div>
            </div>

            <div class="bg-white border border-gray-300 rounded p-6 shadow-sm">
                <h3 class="text-xl font-bold mb-4">Exercises</h3>

                <div class="flex flex-col gap-4">
                    <div class="bg-gray-50 border border-gray-200 rounded p-4">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-bold text-lg">1. Barbell Bench Press</span>
                            <button type="button" class="text-red-500 font-bold hover:underline">Remove</button>
                        </div>
                        <div class="flex flex-col md:flex-row gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Sets</label>
                                <input type="number" value="4" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Reps</label>
                                <input type="text" value="8-10" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Target (kg)</label>
                                <input type="number" placeholder="80" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-50 border border-gray-200 rounded p-4">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-bold text-lg">2. Pull-Ups</span>
                            <button type="button" class="text-red-500 font-bold hover:underline">Remove</button>
                        </div>
                        <div class="flex flex-col md:flex-row gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Sets</label>
                                <input type="number" value="3" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Reps</label>
                                <input type="text" value="Failure" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-bold text-gray-600 mb-1">Target (kg)</label>
                                <input type="number" placeholder="Bodyweight" class="w-full border border-gray-300 p-2 rounded">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" class="w-full mt-4 border-2 border-gray-300 border-dashed text-gray-600 font-bold py-3 rounded hover:border-orange-500 hover:text-orange-500 transition-colors">
                    + Add Another Exercise
                </button>
            </div>

            <div class="flex justify-end mt-2">
                <button type="submit" class="bg-orange-500 text-white font-bold py-3 px-8 rounded hover:bg-orange-600 w-full md:w-auto">
                    Save Workout
                </button>
            </div>
        </form>

    </main>

</body>
</html>
