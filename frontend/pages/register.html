<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/output.css">
    <title>Create Account | FitTracker</title>
</head>
<body class="bg-gradient-to-br from-slate-50 via-gray-100 to-orange-50 min-h-screen flex items-center justify-center p-6 text-gray-900 font-sans">

    <div class="w-full max-w-md bg-white border border-gray-300 rounded-xl p-8 shadow-sm">
        <h1 class="text-3xl font-bold text-orange-500 mb-2 text-center">FitTracker</h1>
        <p class="text-gray-600 text-center mb-6">Create your account to start tracking.</p>

        <form class="flex flex-col gap-4">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Full Name</label>
                <input type="text" placeholder="Enter Name..." class="w-full border border-gray-300 p-3 rounded bg-white">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Email Address</label>
                <input type="email" placeholder="Enter Email..." class="w-full border border-gray-300 p-3 rounded bg-white">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Password</label>
                <input type="password" placeholder="Enter Password" class="w-full border border-gray-300 p-3 rounded bg-white">
            </div>
            <a href="dashboard.html" class="block w-full text-center bg-orange-500 text-white font-bold py-3 rounded hover:bg-orange-600 mt-2">
                Create Account
            </a>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-orange-500 font-bold hover:underline">Login</a>
        </div>
        <div class="mt-4 text-center text-sm text-gray-500">
            <a href="index.html" class="hover:text-orange-500">&larr; Back to Home</a>
        </div>
    </div>

</body>
</html>
